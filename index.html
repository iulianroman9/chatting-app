<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <nav class="app-header">
            <div class="logo">
                <span class="logo-icon">Y</span>
                <h1>yeet</h1>
            </div>

            <form id="search-form" class="search-form">
                <input type="text" id="user-search" placeholder="find users..." autocomplete="off">
                <button type="submit" hidden></button>
            </form>

            <div class="user-profile">
                <div class="avatar"></div>
                <span class="username">@gojo</span>
            </div>
        </nav>

        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>direct messages</h2>
            </header>
            <ul class="friend-list">
                <li class="friend-item" data-user="hollow">
                    <div class="avatar"></div>
                    <div class="info">
                        <span class="username">@hollow</span>
                        <span class="status">Online</span>
                    </div>
                </li>
                <li class="friend-item" data-user="vani">
                    <div class="avatar"></div>
                    <div class="info">
                        <span class="username">@vani</span>
                        <span class="status">Online</span>
                    </div>
                </li>
                <li class="friend-item" data-user="kingzen">
                    <div class="avatar"></div>
                    <div class="info">
                        <span class="username">@kingzen</span>
                        <span class="status">Online</span>
                    </div>
                </li>
            </ul>
        </aside>

        <main class="chat-window">
            <header class="chat-header">
                <div class="chat-info">
                    <h3>@hollow</h3>
                    <span class="status-dot online"></span>
                </div>
            </header>
            
            <div class="message-feed"></div>

            <div class="input-container">
                <form id="message-form" class="input-pill">
                    <button type="button" class="icon-btn" title="Add attachment">+</button>
                    <input type="text" id="message-input" placeholder="message @hollow" autocomplete="off">
                    <button type="button" class="icon-btn" title="GIF">GIF</button>
                    <button type="button" class="icon-btn" title="Emoji">:3</button>
                    <button type="submit" hidden></button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/script.js" type="module"></script>
</body>
</html>
