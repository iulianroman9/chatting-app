<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <div id="login-modal" class="modal-overlay">
            <div class="login-box">
                <h2>welcome</h2>
                <p>enter your username</p>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="username" autocomplete="off" required>
                    <button type="submit">Join Chat</button>
                </form>
            </div>
        </div>

        <nav class="app-header">
            <div class="logo">
                <span class="logo-icon">Y</span>
                <h1>yeet</h1>
            </div>

            <form id="search-form" class="search-form">
                <input type="text" id="user-search" placeholder="find users..." autocomplete="off">
                <button type="submit" hidden></button>
            </form>

            <div class="user-profile">
                <div class="avatar"></div>
                <span class="username">@gojo</span>
            </div>
        </nav>

        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>direct messages</h2>
            </header>
            <ul class="friend-list">
            </ul>
        </aside>

        <main class="chat-window">
            <header class="chat-header">
                <div class="chat-info">
                    <h3></h3>
                    <span class="status-dot online"></span>
                </div>
            </header>
            
            <div class="message-feed"></div>

            <div class="input-container">
                <form id="message-form" class="input-pill">
                    <button type="button" class="icon-btn" title="Add attachment">+</button>
                    <input type="text" id="message-input" placeholder="your message goes here..." autocomplete="off">
                    <button type="button" class="icon-btn" title="GIF">GIF</button>
                    <button type="button" class="icon-btn" title="Emoji">:3</button>
                    <button type="submit" hidden></button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
